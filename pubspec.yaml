name: snipeit_asset_manager
description: Internal IT Asset Management App integrated with Snipe-IT
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # HTTP client
  dio: ^5.7.0

  # Digital signature pad
  signature: ^5.4.0

  # Image conversion utilities
  image: ^4.2.0

  # Environment / config
  flutter_dotenv: ^5.2.1

  # Web file download
  universal_html: ^2.2.4

  # UI utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"